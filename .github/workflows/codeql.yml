# Análisis estático de seguridad de C# con CodeQL (configuración avanzada).
name: Análisis de seguridad (CodeQL)

on:
  pull_request:
    branches: [main, release, developer, "sprint/**"]
  push:
    branches: [main, release, developer, "sprint/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # publicar hallazgos en Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          queries: security-extended
      - run: dotnet restore BlackHellHeim.sln --locked-mode
      - run: dotnet build BlackHellHeim.sln --no-restore --configuration Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:csharp
