# Calidad con SonarQube Cloud. Sin SONAR_TOKEN (p. ej. PR desde bifurcación) el análisis se omite de forma visible.
name: Análisis de calidad (SonarQube Cloud)

on:
  pull_request:
    branches: [main, release, developer, "sprint/**"]
  push:
    branches: [main, release, developer, "sprint/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar-token:
    name: Detección de token de Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      disponible: ${{ steps.detectar.outputs.disponible }}
    steps:
      - id: detectar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then disponible=true; else disponible=false; fi
          echo "disponible=$disponible" >> "$GITHUB_OUTPUT"

  analizar:
    name: SonarQube Cloud
    needs: detectar-token
    if: needs.detectar-token.outputs.disponible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet tool restore
      - name: Iniciar análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.cs.cobertura.reportsPaths=**/TestResults/**/coverage.cobertura.xml
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300
          /d:sonar.sourceEncoding=UTF-8
      - run: dotnet restore BlackHellHeim.sln --locked-mode
      - run: dotnet build BlackHellHeim.sln --no-restore --configuration Release
      - run: dotnet test BlackHellHeim.sln --no-build --configuration Release --collect:"XPlat Code Coverage"
      - name: Finalizar análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end
