# Rollback manual de la aplicación (HU-25): reasigna el tráfico a una revisión anterior.
# No revierte el esquema de la base de datos.
name: Revertir despliegue

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revisión destino (vacío = la activa anterior)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  revertir:
    name: Revertir tráfico
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Revertir
        env:
          DESTINO: ${{ inputs.revision }}
        run: ./scripts/azure/revertir.sh "$DESTINO"
