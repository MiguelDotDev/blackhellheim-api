openapi: 3.1.1
x-pendiente: true  # historia aún no implementada; la prueba de contrato la omite (quitar al implementar)
info:
  title: BlackHellHeim API — pago con Stripe
  version: 0.8.0
paths:
  /pedidos/{id}/pago:
    post:
      operationId: iniciarPago
      summary: Crea (o reutiliza) la sesión de Stripe Checkout del pedido
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: URL de Stripe a la que se redirige a la clienta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionPagoDto'
        '401':
          description: Sin sesión
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Pedido inexistente o de otra clienta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: El pedido no está en PendientePago
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Stripe no pudo crear la sesión
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Stripe no configurado o saturado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Stripe no respondió a tiempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /webhooks/stripe:
    post:
      operationId: recibirWebhookStripe
      summary: Recibe un evento de Stripe con firma verificada
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Marca de tiempo y firma HMAC-SHA256 hexadecimal (formato t=...,v1=...).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Evento aceptado (o repetido, ya procesado)
        '400':
          description: Cuerpo no JSON o sin id o tipo de evento
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Firma ausente, inválida o fuera de tolerancia
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Cuerpo mayor a 1 MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Secreto de webhook no configurado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Un consumidor falló; Stripe puede reintentar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SesionPagoDto:
      type: object
      required: [url, expiraUtc]
      properties:
        url:
          type: string
        expiraUtc:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required: [type, title, status, codigo, idCorrelacion]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        codigo:
          type: string
          description: Código estable del error.
        idCorrelacion:
          type: string
          description: Identificador de correlación de la ejecución.
        errores:
          type: object
          description: Errores por campo; solo en errores de validación.
          additionalProperties:
            type: array
            items:
              type: string
