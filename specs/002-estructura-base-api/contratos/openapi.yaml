openapi: 3.1.1
info:
  title: BlackHellHeim API
  version: 0.1.0
  description: >
    Contrato de la API de la tienda BlackHellHeim. Esta versión inicial define
    únicamente la comprobación de estado de la historia 002 (estructura base). La
    infraestructura completa de OpenAPI (Scalar, servidor mock, publicación al
    frontend) llega en su historia propia de la fundación.
servers:
  - url: http://localhost
    description: Entorno de desarrollo local
paths:
  /salud:
    get:
      operationId: obtenerSalud
      summary: Comprobación de estado de la API
      description: >
        Devuelve el estado de vida de la API. No depende de base de datos,
        almacenamiento de archivos ni proveedores externos.
      responses:
        '200':
          description: La API está en marcha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoSalud'
              examples:
                ok:
                  value:
                    estado: ok
        '500':
          description: Error no controlado
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    EstadoSalud:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          examples: [ok]
    ProblemDetails:
      type: object
      required: [type, title, status, codigo, idCorrelacion]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        codigo:
          type: string
          description: Código estable del error.
        idCorrelacion:
          type: string
          description: Identificador de correlación de la ejecución.
        errores:
          type: object
          description: Errores por campo; solo en errores de validación.
          additionalProperties:
            type: array
            items:
              type: string
