openapi: 3.1.1
info:
  title: BlackHellHeim API — precios (administración)
  version: 0.5.0
  description: >
    Contrato de la historia 020: parámetros de precio versionados y simulación del precio de una
    variante. Fórmula: costo MXN = (costo base USD + extra) × tipo de cambio × (1 + colchón);
    precio = costo MXN ÷ (1 − margen − comisión), redondeado hacia arriba al entero terminado en 9.
    El tipo de cambio (Banxico FIX) se guarda por día; si el proveedor falla se usa el último
    guardado (tipoCambioObsoleto = true) y, si no existe ninguno, 503.
servers:
  - url: http://localhost:5068
    description: Entorno de desarrollo local
paths:
  /admin/precios/parametros:
    get:
      operationId: obtenerParametrosPrecio
      summary: Parámetros de precio vigentes
      security:
        - bearer: []
      responses:
        '200':
          description: Parámetros vigentes
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosPrecioDto'
        '401':
          description: Sin sesión o acceso inválido
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Se requiere el rol Administrador
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error no controlado
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: actualizarParametrosPrecio
      summary: Agrega una versión nueva de los parámetros (vigente desde ahora)
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParametrosPrecioSolicitud'
      responses:
        '200':
          description: Parámetros actualizados
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosPrecioDto'
        '400':
          description: Campo faltante o fuera de rango, o margen + comisión ≥ 1
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sin sesión o acceso inválido
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Se requiere el rol Administrador
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error no controlado
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /admin/precios/simular:
    get:
      operationId: simularPrecio
      summary: Desglose del precio de una variante
      security:
        - bearer: []
      parameters:
        - name: varianteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Desglose
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesglosePrecioDto'
        '400':
          description: Datos inválidos
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Sin sesión o acceso inválido
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Se requiere el rol Administrador
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No existe
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Sin tipo de cambio disponible (tipo_cambio_no_disponible)
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error no controlado
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ParametrosPrecioDto:
      type: object
      required: [colchonCambiario, margen, comisionPasarela, impresionExtraUsd]
      properties:
        colchonCambiario:
          type: number
          format: double
        margen:
          type: number
          format: double
        comisionPasarela:
          type: number
          format: double
        impresionExtraUsd:
          type: number
          format: double
    ParametrosPrecioSolicitud:
      type: object
      properties:
        colchonCambiario:
          type: [number, 'null']
          format: double
        margen:
          type: [number, 'null']
          format: double
        comisionPasarela:
          type: [number, 'null']
          format: double
        impresionExtraUsd:
          type: [number, 'null']
          format: double
    DesglosePrecioDto:
      type: object
      required: [costoBaseUsd, impresionExtraUsd, tipoCambio, tipoCambioFecha, tipoCambioObsoleto, colchonCambiario, margen, comisionPasarela, costoMxn, precioBrutoMxn, precioFinalMxn]
      properties:
        costoBaseUsd:
          type: number
          format: double
        impresionExtraUsd:
          type: number
          format: double
        tipoCambio:
          type: number
          format: double
        tipoCambioFecha:
          type: string
          format: date
        tipoCambioObsoleto:
          type: boolean
        colchonCambiario:
          type: number
          format: double
        margen:
          type: number
          format: double
        comisionPasarela:
          type: number
          format: double
        costoMxn:
          type: number
          format: double
        precioBrutoMxn:
          type: number
          format: double
        precioFinalMxn:
          type: number
          format: double
    ProblemDetails:
      type: object
      required: [type, title, status, codigo, idCorrelacion]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        codigo:
          type: string
          description: Código estable del error.
        idCorrelacion:
          type: string
          description: Identificador de correlación de la ejecución.
        errores:
          type: object
          description: Errores por campo; solo en errores de validación.
          additionalProperties:
            type: array
            items:
              type: string
