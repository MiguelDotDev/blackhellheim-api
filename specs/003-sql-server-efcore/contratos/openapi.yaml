openapi: 3.1.1
info:
  title: BlackHellHeim API — base de datos local
  version: 0.3.0
  description: >
    Contrato de la comprobación de disponibilidad de la base de datos de la historia 003.
    La comprobación de estado `GET /salud` se define en
    `specs/002-estructura-base-api/contratos/openapi.yaml` y se mantiene sin cambios: sigue
    siendo una comprobación de vida del API que no depende de la base. La documentación
    interactiva con Scalar queda fuera del alcance de esta historia.
servers:
  - url: http://localhost:5068
    description: Entorno de desarrollo local
paths:
  /salud/base:
    get:
      operationId: obtenerSaludBaseDatos
      summary: Comprobación de disponibilidad de la base de datos
      description: >
        Informa si la base de datos configurada responde. No expone credenciales, nombres de
        servidor, cadenas de conexión ni detalles internos. La comprobación tiene un tiempo
        máximo de espera acotado (3 segundos) para no dejar la petición colgada.
      parameters:
        - name: X-Correlation-ID
          in: header
          required: false
          description: >
            Identificador de correlación de la petición. Si falta o no es válido, el servidor
            genera uno y lo devuelve en la respuesta.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: La base de datos está disponible
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoBaseDatos'
              examples:
                disponible:
                  value:
                    estado: disponible
        '503':
          description: La base de datos no está disponible
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noDisponible:
                  value:
                    type: https://blackhellheim.mx/errores/base_no_disponible
                    title: Base de datos no disponible
                    status: 503
                    detail: La base de datos no respondió. Verifica que el servicio local esté en marcha.
                    instance: /salud/base
                    codigo: base_no_disponible
                    idCorrelacion: 7f3c2a9e4b1d4c8f9a0e6d5b2c1f8a7e
        '500':
          description: Error no controlado
          headers:
            X-Correlation-ID:
              description: Identificador de correlación de la ejecución.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    EstadoBaseDatos:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          examples: [disponible]
          description: Indica que la base de datos respondió a la comprobación.
    ProblemDetails:
      type: object
      required: [type, title, status, codigo, idCorrelacion]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        codigo:
          type: string
          description: Código estable del error.
        idCorrelacion:
          type: string
          description: Identificador de correlación de la ejecución.
        errores:
          type: object
          description: Errores por campo; solo en errores de validación.
          additionalProperties:
            type: array
            items:
              type: string
