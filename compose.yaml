# Entorno local de BlackHellHeim (historias 003 y 005). Los secretos llegan por variables de
# entorno (.env, ignorado por git); aquí solo hay referencias a ellas.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${BHH_SQL_SA_PASSWORD:?Defina BHH_SQL_SA_PASSWORD en .env}
    ports:
      - "1433:1433"
    volumes:
      - datos-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Almacén de archivos local (historia 017). Solo puerto Blob; --skipApiVersionCheck porque el SDK
  # suele ir por delante de la versión de Azurite.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - datos-azurite:/data

  # Contenedor de un solo uso: aplica las migraciones y las semillas con el bundle de EF Core.
  migraciones:
    build:
      context: .
      target: migraciones
    image: blackhellheim-migraciones:local
    environment:
      ConnectionStrings__BlackHellHeim: Server=sqlserver,1433;Database=BlackHellHeim;User Id=sa;Password=${BHH_SQL_SA_PASSWORD:?Defina BHH_SQL_SA_PASSWORD en .env};Encrypt=True;TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: final
    image: blackhellheim-api:local
    environment:
      ConnectionStrings__BlackHellHeim: Server=sqlserver,1433;Database=BlackHellHeim;User Id=sa;Password=${BHH_SQL_SA_PASSWORD:?Defina BHH_SQL_SA_PASSWORD en .env};Encrypt=True;TrustServerCertificate=True
      # Autenticación (historia 013): la clave de firma es obligatoria; el administrador inicial es opcional.
      Jwt__Clave: ${BHH_JWT_CLAVE:?Defina BHH_JWT_CLAVE en .env (mínimo 32 caracteres)}
      Administrador__Correo: ${BHH_ADMIN_CORREO:-}
      Administrador__Contrasena: ${BHH_ADMIN_CONTRASENA:-}
      # Printful (historia 015): opcional; sin token los endpoints de catálogo responden 502.
      Printful__Token: ${BHH_PRINTFUL_TOKEN:-}
      # Tipo de cambio (historia 020): opcional; sin token el precio usa el último tipo de cambio guardado o responde 503.
      Banxico__Token: ${BHH_BANXICO_TOKEN:-}
      # Almacén de arte (historia 017): por omisión Azurite del compose; en producción, la cadena de la Storage Account.
      AlmacenArchivos__CadenaConexion: ${BHH_ALMACEN_CADENA:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}
    ports:
      - "${BHH_API_PUERTO:-5068}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/sonda-http.sh", "/salud/base"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  datos-sqlserver:
  datos-azurite:
